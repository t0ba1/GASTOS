<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gastos">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono.png">
    
    <title>Registro de Gastos</title>
    <style>
        /* Diseño Dark Mode Minimalista */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            font-size: 24px;
            margin-top: 40px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Input de Monto */
        #monto {
            width: 100%;
            max-width: 350px;
            background-color: #1e1e1e;
            border: 2px solid #333;
            color: #fff;
            font-size: 40px;
            text-align: center;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-sizing: border-box;
            outline: none;
        }

        #monto:focus {
            border-color: #4CAF50;
        }

        #monto::placeholder {
            color: #666;
        }

        /* Grilla de Categorías */
        .grid-categorias {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 30px; /* Espacio antes del botón final */
        }

        .btn-categoria {
            background-color: #2c2c2e;
            color: #fff;
            border: 2px solid transparent;
            padding: 20px 10px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Estado cuando la categoría está seleccionada */
        .btn-categoria.seleccionada {
            background-color: #3d3d3d;
            border-color: #ffffff;
        }

        /* Botón de Confirmación Principal */
        .btn-cargar {
            background-color: #4CAF50; /* Verde */
            color: white;
            border: none;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            cursor: pointer;
            display: block; /* Centrado */
            transition: background-color 0.2s;
        }

        .btn-cargar:active {
            background-color: #3e8e41; /* Verde más oscuro al tocar */
        }

        /* Mensaje de Confirmación */
        #mensaje {
            margin-top: 30px;
            font-size: 18px;
            color: #4CAF50;
            opacity: 0;
            transition: opacity 0.3s;
            height: 24px;
        }
    </style>
</head>
<body>

    <h1>💰 Nuevo Gasto</h1>

    <input type="number" id="monto" placeholder="$ 0" inputmode="decimal" pattern="[0-9]*">

    <div class="grid-categorias">
        <!-- Ahora los botones solo seleccionan, no envían -->
        <button class="btn-categoria" onclick="seleccionarCategoria(this, 'Almuerzo laburo')">Almuerzo laburo</button>
        <button class="btn-categoria" onclick="seleccionarCategoria(this, 'Planes')">Planes</button>
        <button class="btn-categoria" onclick="seleccionarCategoria(this, 'Deporte')">Deporte</button>
        <button class="btn-categoria" onclick="seleccionarCategoria(this, 'Fiesta')">Fiesta</button>
        <button class="btn-categoria" onclick="seleccionarCategoria(this, 'Transporte')">Transporte</button>
        <button class="btn-categoria" onclick="seleccionarCategoria(this, 'Compras')">Compras</button>
    </div>

    <!-- El nuevo botón centrado y verde -->
    <button class="btn-cargar" onclick="ejecutarCarga()">Cargar Gasto</button>

    <div id="mensaje">Gasto guardado ✅</div>

    <script>
        // --- PEGA TU URL AQUÍ ABAJO OTRA VEZ ---
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbw1l5siBPXwvbZZMxRhmJHGwSCP0q13zT2paf6uQ1JkIv7hCeXtzhQHYVhqKKtgSm3JHA/exec";
        // ---------------------------------------

        // Variable para recordar qué categoría tocó el usuario
        let categoriaElegida = "";

        // Función 1: Solo pinta el botón elegido y guarda el nombre
        function seleccionarCategoria(botonHTML, nombreCategoria) {
            categoriaElegida = nombreCategoria;

            // Le quitamos la clase 'seleccionada' a todos los botones
            const botones = document.querySelectorAll('.btn-categoria');
            botones.forEach(b => b.classList.remove('seleccionada'));

            // Se la ponemos solo al botón que acabamos de tocar
            botonHTML.classList.add('seleccionada');
        }

        // Función 2: Lee los datos y los envía al Sheet
        function ejecutarCarga() {
            const inputMonto = document.getElementById('monto');
            const montoValor = inputMonto.value;

            // Control de seguridad: Si no puso monto o no eligió categoría, no hace nada
            if (montoValor === "" || categoriaElegida === "") return;

            const formData = new URLSearchParams();
            formData.append('monto', montoValor);
            formData.append('categoria', categoriaElegida);

            fetch(URL_GOOGLE_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData.toString()
            }).then(() => {
                // Limpiar todo después de enviar con éxito
                inputMonto.value = '';
                categoriaElegida = '';
                document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('seleccionada'));
                mostrarConfirmacion();
            }).catch(() => {
                // Limpiar todo incluso si hay fallo de red (para que el usuario no se trabe)
                inputMonto.value = '';
                categoriaElegida = '';
                document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('seleccionada'));
                mostrarConfirmacion(); 
            });
        }

        function mostrarConfirmacion() {
            const msj = document.getElementById('mensaje');
            msj.style.opacity = '1';
            setTimeout(() => {
                msj.style.opacity = '0';
            }, 2000);
        }
    </script>
</body>
</html>
