<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuraciones clave para iOS y PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gastos">
    <link rel="manifest" href="manifest.json">
    
    <title>Registro de Gastos</title>
    <style>
        /* Diseño Dark Mode Minimalista */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Quita el destello azul en iOS al tocar */
        }

        h1 {
            font-size: 24px;
            margin-top: 40px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Input de Monto */
        #monto {
            width: 100%;
            max-width: 350px;
            background-color: #1e1e1e;
            border: 2px solid #333;
            color: #fff;
            font-size: 40px;
            text-align: center;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-sizing: border-box;
            outline: none;
        }

        #monto:focus {
            border-color: #4CAF50;
        }

        #monto::placeholder {
            color: #666;
        }

        /* Grilla de Categorías */
        .grid-categorias {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .btn-categoria {
            background-color: #2c2c2e;
            color: #fff;
            border: none;
            padding: 20px 10px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-categoria:active {
            background-color: #4CAF50; /* Feedback visual al tocar */
        }

        /* Mensaje de Confirmación */
        #mensaje {
            margin-top: 30px;
            font-size: 18px;
            color: #4CAF50;
            opacity: 0;
            transition: opacity 0.3s;
            height: 24px;
        }
    </style>
</head>
<body>

    <h1>💰 Nuevo Gasto</h1>

    <!-- inputmode="decimal" levanta el teclado numérico en iOS -->
    <input type="number" id="monto" placeholder="$ 0" inputmode="decimal" pattern="[0-9]*">

    <div class="grid-categorias">
        <button class="btn-categoria" onclick="guardarGasto('Almuerzo laburo')">Almuerzo laburo</button>
        <button class="btn-categoria" onclick="guardarGasto('Planes')">Planes</button>
        <button class="btn-categoria" onclick="guardarGasto('Deporte')">Deporte</button>
        <button class="btn-categoria" onclick="guardarGasto('Fiesta')">Fiesta</button>
        <button class="btn-categoria" onclick="guardarGasto('Transporte')">Transporte</button>
        <button class="btn-categoria" onclick="guardarGasto('Compras')">Compras</button>
    </div>

    <div id="mensaje">Gasto guardado ✅</div>

    <script>
        // --- PEGA TU URL AQUÍ ABAJO ---
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbw1l5siBPXwvbZZMxRhmJHGwSCP0q13zT2paf6uQ1JkIv7hCeXtzhQHYVhqKKtgSm3JHA/exec";
        // ------------------------------

        function guardarGasto(categoria) {
            const inputMonto = document.getElementById('monto');
            const montoValor = inputMonto.value;

            // Si el monto está vacío, no hacemos nada (evita errores silenciosos)
            if (montoValor === "") return;

            // Preparamos los datos
            const formData = new URLSearchParams();
            formData.append('monto', montoValor);
            formData.append('categoria', categoria);

            // Enviamos los datos en segundo plano (mode: 'no-cors' garantiza que no haya bloqueos de seguridad del navegador)
            fetch(URL_GOOGLE_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData.toString()
            }).then(() => {
                // Éxito: Limpiamos el input y mostramos mensaje
                inputMonto.value = '';
                mostrarConfirmacion();
            }).catch(() => {
                // En caso de fallo de red, asumimos la política de no mostrar errores técnicos,
                // pero limpiamos igual para mantener el flujo rápido.
                inputMonto.value = '';
                mostrarConfirmacion(); 
            });
        }

        function mostrarConfirmacion() {
            const msj = document.getElementById('mensaje');
            msj.style.opacity = '1';
            
            // Ocultar mensaje después de 2 segundos
            setTimeout(() => {
                msj.style.opacity = '0';
            }, 2000);
        }
    </script>
</body>
</html>
